<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fluidstack Site Brief status stub" />
    <title>Fluidstack Site Brief</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0c0f;
        --panel: #12161c;
        --border: #2a3340;
        --text: #e8eef6;
        --muted: #93a0b3;
        --cyan: #22d3ee;
        --amber: #f59e0b;
        font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        padding: 1.5rem;
      }
      .panel {
        max-width: 520px;
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.5rem;
      }
      .eyebrow {
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.68rem;
        color: var(--amber);
        font-weight: 600;
      }
      h1 { margin: 0.4rem 0; font-size: 1.4rem; }
      p { color: var(--muted); line-height: 1.5; }
      a { color: var(--cyan); }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="eyebrow">Status</div>
      <h1>Site Brief coming soon</h1>
      <p>
        This path is reserved for the standalone Site Brief app.
        It will land from the fluidstack-site-brief source once ready.
      </p>
      <p>
        Meanwhile use the embedded brief on
        <a href="../site-fit/">Site Fit</a>
        or return to the
        <a href="../">hub</a>.
      </p>
    </div>
  </body>
</html>
